<!doctype html>
<html lang="es">
    <head>
        {{template "_head.html" .}}
        <title>{{.Title}}</title>
    </head>
    <body>
        <div class="container">
            {{template "_nav.html"}}

            <div class="row-fluid">
                <h1>{{.Title}}<br /><small>{{.Subtitle}}</small></h1>
            </div>
            <div class="row-fluid">
                <div class="span12 font-size-18px">
                    <ul>
                        {{ range $element := .Items }}
                        <li>
                            <a href="{{$element.Link}}">{{$element.Title}}</a>
                        </li>
                        {{ end }}
                    </ul>
                </div>
            </div>

            {{template "_footer.html"}}
        </div>
        {{template "_scripts.html"}}
        <script type="text/javascript">
            document.getElementById("{{.Name}}").classList.add("active");
        </script>
    </body>
</html>
