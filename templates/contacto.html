<!doctype html>
<html lang="es">
    <head>
        {{template "_head.html" .}}
        <title>Contacto</title>
    </head>
    <body>
        <div class="container">
            {{template "_nav.html"}}

            <div class="row-fluid">
                <h1>Contacto</h1>
            </div>
            <div class="row-fluid">
                <div class="span5">
                    <form class="form-signin">
                        <input
                            type="text"
                            class="input-block-level"
                            placeholder="Email"
                        />
                        <input
                            type="text"
                            class="input-block-level"
                            placeholder="Mensaje"
                        />
                        <button class="btn btn-large btn-primary" type="submit">
                            Contactar
                        </button>
                    </form>
                </div>
            </div>

            {{template "_footer.html"}}
        </div>
        {{template "_scripts.html"}}
        <script type="text/javascript">
            document.getElementById("contacto").classList.add("active");
        </script>
    </body>
</html>
