<p>
    El vals chilote es una variante del vals, originado en el Tirol (Austria)
    por el siglo XII, que llegó a los ambientes aristocráticos de Chile a
    mediados del siglo XIX y se adaptó a la fisonomía de cada región,
    adquiriendo una identidad definida y diferenciada.
